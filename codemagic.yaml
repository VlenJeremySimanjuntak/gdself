workflows:
  ios-build:
    name: GDSelf iOS Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    working_directory: frontend

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - frontend/build/ios/iphoneos/*.app
